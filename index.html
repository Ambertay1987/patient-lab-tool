<!DOCTYPE html>
<html>
<head>
<title>Lab Decoder</title>

<style>
body {
  background: black;
  color: #00ffff;
  font-family: Arial;
  text-align: center;
  padding-top: 50px;
}

h1 {
  color: #00ffff;
  text-shadow: 0 0 10px #00ffff;
}

input {
  padding: 10px;
  margin: 10px;
  background: black;
  border: 1px solid #00ffff;
  color: #00ffff;
}

button {
  padding: 10px 20px;
  background: #00ffff;
  border: none;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

#result {
  margin-top: 20px;
  font-size: 20px;
}
</style>

</head>

<body>

<h1>Lab Decoder</h1>

<input id="lab" placeholder="Enter lab value">
<br>
<button onclick="analyze()">Analyze</button>

<div id="result"></div>

<script>
function analyze() {
  let value = document.getElementById("lab").value;

  if (value < 50) {
    document.getElementById("result").innerText = "Low — possible deficiency";
  } else if (value > 100) {
    document.getElementById("result").innerText = "High — possible inflammation";
  } else {
    document.getElementById("result").innerText = "Within range";
  }
}
</script>

</body>
</html>
